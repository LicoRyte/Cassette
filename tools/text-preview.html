<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solarist Text Preview</title>
<style>
  :root { --bg: #171320; --panel: #221c2e; --line: #3a3150; --text: #e8e3f0; --mute: #9a90ad; --accent: #e8c170; --bad: #f08080; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { margin: 0 0 18px; color: var(--mute); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--accent); }
  label { display: block; color: var(--mute); font-size: 13px; margin: 8px 0 4px; }
  select, input, textarea, button { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  textarea { width: 100%; height: 260px; font: 13px/1.45 ui-monospace, Consolas, monospace; }
  button { cursor: pointer; background: #2e2640; }
  button:hover { border-color: var(--accent); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  ol { margin: 0; padding-left: 22px; }
  ol li { margin: 0 0 8px; }
  .warn { color: var(--bad); font-size: 13px; }
  .files li { font-size: 13px; color: var(--mute); }
  .files .bad { color: var(--bad); }
  .item { padding: 6px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .item b { color: var(--text); }
  .item small { color: var(--mute); display: block; }
  code { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Text preview</h1>
  <p class="sub">Try the lines in <code>content/</code> without playing. Edit a JSON file, then press Reload files. Serve the game folder first (for example <code>python -m http.server 8800</code>) and open <code>/tools/text-preview.html</code>.</p>
  <div class="grid">
    <section>
      <h2>Scene</h2>
      <div class="row">
        <label style="margin:0">Group <select id="group"></select></label>
        <button id="roll" type="button">New lines</button>
        <button id="reload" type="button">Reload files</button>
      </div>
      <label for="ctx">What's happening (JSON). Lines whose "when" doesn't match this are skipped.</label>
      <textarea id="ctx" spellcheck="false"></textarea>
      <div class="row" style="margin-top:8px">
        <button id="randItem" type="button">Random item</button>
        <button id="randTrait" type="button">Random crew trait</button>
        <button id="pron" type="button">Switch pronouns</button>
      </div>
      <p id="ctxErr" class="warn"></p>
    </section>
    <section>
      <h2>Lines</h2>
      <ol id="out"></ol>
      <p id="warn" class="warn"></p>
      <h2 style="margin-top:16px">Files</h2>
      <ul id="files" class="files"></ul>
    </section>
  </div>
  <section style="margin-top:16px">
    <h2>Items (<span id="itemN">0</span>)</h2>
    <div id="items"></div>
  </section>
</main>
<script src="../js/world/random.js"></script>
<script src="../js/world/text.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const SAMPLE = {
  crew: { name: 'Mara', pronouns: 'she', home: 'the old harbour', tags: ['nervous'] },
  item: { name: 'brass lantern', tags: ['light', 'shiny'] },
  place: 'the Hollow Flats', biome: 'salt flat', time: 'dusk', weather: 'clear', temp: 0.2, water: 0.4, life: 0.6
};
$('ctx').value = JSON.stringify(SAMPLE, null, 2);
let seed = Date.now() % 100000;

function ctx() {
  try { const c = JSON.parse($('ctx').value); $('ctxErr').textContent = ''; return c; }
  catch (e) { $('ctxErr').textContent = 'The scene isn\'t valid JSON: ' + e.message; return null; }
}
function setCtx(f) { const c = ctx(); if (!c) return; f(c); $('ctx').value = JSON.stringify(c, null, 2); render(); }

function render() {
  const c = ctx(), g = $('group').value; if (!c || !g) return;
  TEXT.warn = [];
  const r = rng(seed), out = [];
  for (let i = 0; i < 8; i++) out.push(txLine(g, c, r) || '(no line in this group fits this scene)');
  $('out').replaceChildren(...out.map(t => Object.assign(document.createElement('li'), { textContent: t })));
  $('warn').textContent = [...new Set(TEXT.warn)].join(' · ');
}

async function load() {
  TEXT.lines = {}; TEXT.items = [];
  // the same list the game uses, read from js/boot.js
  let files = [];
  try { const b = await (await fetch('../js/boot.js', { cache: 'no-cache' })).text(); const m = b.match(/CONTENT_FILES\s*=\s*\[([^\]]*)\]/); files = m ? [...m[1].matchAll(/'([^']+)'/g)].map(x => x[1]) : []; }
  catch (e) { files = []; }
  const rows = [];
  for (const f of files) {
    try {
      const res = await fetch('../' + f, { cache: 'no-cache' });
      if (!res.ok) throw new Error('not found');
      const txt = await res.text(); let j;
      try { j = JSON.parse(txt); } catch (e) { throw new Error('broken JSON: ' + e.message); }
      txLoad(j);
      rows.push([f + ': ok', '']);
    } catch (e) { rows.push([f + ': ' + e.message, 'bad']); }
  }
  $('files').replaceChildren(...rows.map(([t, c]) => Object.assign(document.createElement('li'), { textContent: t, className: c })));
  const keep = $('group').value, groups = Object.keys(TEXT.lines).sort();
  $('group').replaceChildren(...groups.map(g => Object.assign(document.createElement('option'), { value: g, textContent: g + ' (' + TEXT.lines[g].length + ')' })));
  if (groups.includes(keep)) $('group').value = keep;
  $('itemN').textContent = TEXT.items.length;
  $('items').replaceChildren(...TEXT.items.map(it => { const d = document.createElement('div'); d.className = 'item';
    d.append(Object.assign(document.createElement('b'), { textContent: it.name }), ' · ' + it.kind,
      Object.assign(document.createElement('small'), { textContent: it.desc + (it.tags && it.tags.length ? '  [' + it.tags.join(', ') + ']' : '') })); return d; }));
  render();
}

$('group').addEventListener('change', render);
$('ctx').addEventListener('input', render);
$('roll').addEventListener('click', () => { seed++; render(); });
$('reload').addEventListener('click', load);
$('randItem').addEventListener('click', () => setCtx(c => { const it = txRandomItem(Math.random, 'equipment') || txRandomItem(Math.random); if (it) c.item = { name: it.name, tags: it.tags || [] }; }));
$('randTrait').addEventListener('click', () => setCtx(c => { const t = txRandomItem(Math.random, 'trait'); if (t) { c.crew = c.crew || {}; c.crew.tags = t.tags || []; c.crew.trait = t.name; } }));
$('pron').addEventListener('click', () => setCtx(c => { c.crew = c.crew || {}; const o = ['she', 'he', 'they']; c.crew.pronouns = o[(o.indexOf(c.crew.pronouns) + 1) % 3]; }));
load();
</script>
</body>
</html>
